<div class="min-h-screen">
  <div *ngIf="!token" class="min-h-screen bg-gradient-to-br from-blue-500 via-purple-600 to-indigo-700 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full transform transition-all duration-500 hover:scale-105">
      <!-- Logo Section -->
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
          <span class="text-white text-2xl font-bold">ATS</span>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-2">人才招募系統</h1>
        <p class="text-gray-500 text-sm uppercase tracking-wider">Applicant Tracking System</p>
      </div>

      <!-- Login Content -->
      <div class="space-y-6">
        <div class="text-center">
          <h2 class="text-2xl font-semibold text-gray-700 mb-3">歡迎使用</h2>
          <p class="text-gray-600 leading-relaxed">請使用您的 Google 帳號登入以開始使用系統</p>
        </div>

        <!-- Google Sign-in Button -->
        <div class="flex justify-center py-4">
          <div class="w-full max-w-xs">
            <div id="g_id_signin" class="transform transition-transform duration-200 hover:-translate-y-1 flex justify-center"></div>
            <!-- 後備登入按鈕，如果 Google API 載入失敗 -->
            <div *ngIf="!token" class="hidden" id="fallback-login">
              <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition-colors duration-200 flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                  <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                  <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>使用 Google 登入</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Features Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-6 border-t border-gray-200">
          <div class="flex flex-col items-center space-y-2 p-3 rounded-lg hover:bg-gray-50 transition-colors">
            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
              <i class="pi pi-users text-blue-600 text-xl"></i>
            </div>
            <span class="text-sm font-medium text-gray-700">人才管理</span>
          </div>
          <div class="flex flex-col items-center space-y-2 p-3 rounded-lg hover:bg-gray-50 transition-colors">
            <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center">
              <i class="pi pi-chart-bar text-purple-600 text-xl"></i>
            </div>
            <span class="text-sm font-medium text-gray-700">數據分析</span>
          </div>
          <div class="flex flex-col items-center space-y-2 p-3 rounded-lg hover:bg-gray-50 transition-colors">
            <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center">
              <i class="pi pi-bolt text-indigo-600 text-xl"></i>
            </div>
            <span class="text-sm font-medium text-gray-700">高效招募</span>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-gray-200 text-center">
        <p class="text-xs text-gray-400">安全登入 • 隱私保護 • 專業服務</p>
      </div>
    </div>
  </div>

  <div *ngIf="token" class="min-h-screen bg-gray-50">
    <router-outlet></router-outlet>
  </div>
</div>
