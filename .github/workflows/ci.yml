name: CI

on:
  push:
    branches: [develop, prod]
  pull_request:
    branches: [develop]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: Build Angular
        run: npm run build

      - name: 登入 Azure Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/ats-web:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/ats-web:${{ github.ref_name }}
